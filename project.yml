name: SonosBar
options:
  bundleIdPrefix: at.uebeleis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: G33B89LJ73
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SonosKit:
    path: SonosKit
targets:
  SonosBar:
    type: application
    platform: macOS
    sources: [SonosBar]
    dependencies:
      - package: SonosKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.uebeleis.sonosbar
        PRODUCT_NAME: SonosBar
        INFOPLIST_FILE: SonosBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: SonosBar/SonosBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
